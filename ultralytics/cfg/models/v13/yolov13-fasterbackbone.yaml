# YOLOv13 with a FasterNet backbone (PConv, CVPR 2023 "Run, Don't Walk").
#
# Every backbone computation stage is FasterNet-based; the downsampling convs
# (patch-merging analog) and the entire head are identical to yolov13.yaml, so
# this is a clean backbone-only ablation. Stage widths at layers 4/6/8 must
# stay 512/512/1024 (128/128/256 at n): HyperACE + FullPAD_Tunnel tap those
# indices with fixed channel expectations.
#
# Design notes (measured at n scale, 640x640):
#   - L6/L8 replace the two A2C2f attention stacks (1.08 GFLOPs, 852k params)
#     with residual FasterNetBlock stacks; HyperACE in the head still provides
#     cross-scale global modeling right after.
#   - L4 uses the partial-channel arrangement (C3k2_Faster, e=0.25): a
#     full-width FasterNetBlock at 80x80x128 costs ~0.96 GFLOPs, ~4x the
#     stage it replaces. The blocks inside are FasterNetBlocks.
#   - Repeats are written at base scale (depth gain 0.5 at n/s): "2" = 1 block.
#     Bump L6/L8 to 4 (= 2 blocks, +0.48 GFLOPs total) if mAP needs depth.
#   - FasterNetBlock YAML args: [c2, n_div, mlp_ratio, k]; defaults follow the
#     paper (n_div=4, mlp_ratio=2, k=3 via PCONV_KERNEL in fasternet.py).

nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]   # Nano
  s: [0.50, 0.50, 1024]   # Small
  l: [1.00, 1.00, 512]    # Large
  x: [1.00, 1.50, 512]    # Extra Large

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv,  [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv,  [128, 3, 2, 1, 2]] # 1-P2/4
  - [-1, 2, FasterNetBlock, [128]] # 2
  - [-1, 1, Conv,  [256, 3, 2, 1, 4]] # 3-P3/8
  - [-1, 2, C3k2_Faster, [512, False, 0.25]] # 4 (partial-channel FasterNet stage)
  - [-1, 1, DSConv,  [512, 3, 2]] # 5-P4/16
  - [-1, 2, FasterNetBlock, [512]] # 6
  - [-1, 1, DSConv,  [1024, 3, 2]] # 7-P5/32
  - [-1, 2, FasterNetBlock, [1024]] # 8

head:
  - [[4, 6, 8], 2, HyperACE, [512, 8, True, True, 0.5, 1, "both"]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [ 9, 1, DownsampleConv, []]
  - [[6, 9], 1, FullPAD_Tunnel, []]  #12
  - [[4, 10], 1, FullPAD_Tunnel, []]  #13
  - [[8, 11], 1, FullPAD_Tunnel, []] #14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 12], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, DSC3k2, [512, True]] # 17
  - [[-1, 9], 1, FullPAD_Tunnel, []]  #18

  - [17, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 13], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, DSC3k2, [256, True]] # 21
  - [10, 1, Conv, [256, 1, 1]]
  - [[21, 22], 1, FullPAD_Tunnel, []]  #23

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 18], 1, Concat, [1]] # cat head P4
  - [-1, 2, DSC3k2, [512, True]] # 26
  - [[-1, 9], 1, FullPAD_Tunnel, []]  #27

  - [26, 1, Conv, [512, 3, 2]]
  - [[-1, 14], 1, Concat, [1]] # cat head P5
  - [-1, 2, DSC3k2, [1024, True]] # 30
  - [[-1, 11], 1, FullPAD_Tunnel, []]  #31

  - [[23, 27, 31], 1, Detect, [nc]] # Detect(P3, P4, P5)
